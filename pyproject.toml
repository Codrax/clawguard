[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clawguard"
description = "Find your 1Claw vault secrets in code, staged changes and git history. Audit expiry and age."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "clawguard contributors" }]
keywords = ["1claw", "secrets", "secret-scanning", "security", "pre-commit", "git", "vault"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
clawguard = "clawguard.cli:main"

[tool.setuptools.dynamic]
version = { attr = "clawguard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Optional[...] stays: it is the spelling that works at runtime on 3.9 too
ignore = ["E701", "E702", "UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["clawguard"]
known-local-folder = ["fake_api"]
