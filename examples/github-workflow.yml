# .github/workflows/clawguard.yml
name: clawguard
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # Mondays: scan history and audit the vault
permissions:
  contents: read
  security-events: write   # for the SARIF upload
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Codrax/clawguard@v0.1.0
        with:
          api-key: ${{ secrets.ONECLAW_API_KEY }}
          vault: ${{ vars.ONECLAW_VAULT_ID }}
          history: ${{ github.event_name == 'schedule' }}
          sarif: clawguard.sarif
      - if: always() && hashFiles('clawguard.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clawguard.sarif

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/Codrax/clawguard@v0.1.0
      - run: clawguard audit -f markdown --fail-on expired,expiring >> "$GITHUB_STEP_SUMMARY"
        env:
          ONECLAW_API_KEY: ${{ secrets.ONECLAW_API_KEY }}
          ONECLAW_VAULT_ID: ${{ vars.ONECLAW_VAULT_ID }}
